<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookstore</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS (Combined from style.css) -->
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            transition: transform 0.2s ease-in-out;
            border: none;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img-top {
            height: 300px;
            object-fit: cover;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .btn-whatsapp {
            background-color: #25D366;
            border-color: #25D366;
            color: white;
        }

        .btn-whatsapp:hover {
            background-color: #1ebe5d;
            border-color: #1ebe5d;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-book"></i> My Bookstore
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">
        <h1 class="text-center mb-2">Our Collection</h1>
        <p class="text-center text-muted mb-5">Click "Order via WhatsApp" to purchase. Send your payment receipt to confirm!</p>
        
        <!-- Books will be injected here by JavaScript -->
        <div id="books-container" class="row g-4">
            <div class="col-12 text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2026 My Bookstore. All rights reserved.</p>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Firebase SDKs (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
    <!-- Custom JS (Combined from script.js) -->
    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION
        // ==========================================
        // REPLACE THIS with your actual Firebase config from the Firebase Console
        const firebaseConfig = {
            apiKey: "AIzaSyAs8-m0xob9x-ItgT45-4fUBRKfSGv97gY",
  authDomain: "thebookshelf-aff4e.firebaseapp.com",
  projectId: "thebookshelf-aff4e",
  storageBucket: "thebookshelf-aff4e.firebasestorage.app",
  messagingSenderId: "1079616657953",
  appId: "1:1079616657953:web:cc7917275255177c4fe160",
  measurementId: "G-MFGK8H9XCT"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==========================================
        // 2. WHATSAPP CONFIGURATION
        // ==========================================
        // Enter your WhatsApp number with country code (NO +, NO spaces, NO dashes)
        // Example: 1234567890 (for US) or 447123456789 (for UK)
        const WHATSAPP_NUMBER = "9779808276033"; 

        // ==========================================
        // 3. FETCH AND RENDER BOOKS
        // ==========================================
        const booksContainer = document.getElementById('books-container');

        db.collection("books").get().then((querySnapshot) => {
            booksContainer.innerHTML = ''; // Clear the loading spinner
            
            if (querySnapshot.empty) {
                booksContainer.innerHTML = '<p class="text-center text-muted col-12">No books available at the moment.</p>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const book = doc.data();
                
                // Create the pre-filled WhatsApp message
                const message = `Hi! I would like to order the book: "${book.title}" by ${book.author}.\nPrice: $${book.price}\n\nI will send the payment receipt shortly.`;
                const encodedMessage = encodeURIComponent(message);
                const whatsappLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;

                // Fallback image if none is provided in Firebase
                const bookImage = book.image || 'https://via.placeholder.com/300x400?text=No+Cover';

                // Build the HTML card
                const bookCard = `
                    <div class="col-lg-3 col-md-4 col-sm-6">
                        <div class="card h-100 shadow-sm">
                            <img src="${bookImage}" class="card-img-top" alt="${book.title}">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${book.title}</h5>
                                <p class="card-text text-muted small">by ${book.author}</p>
                                <p class="card-text fw-bold fs-5 text-primary">$${book.price}</p>
                                <p class="card-text flex-grow-1 small">${book.description || 'No description available.'}</p>
                                
                                <a href="${whatsappLink}" target="_blank" class="btn btn-whatsapp mt-auto">
                                    <i class="bi bi-whatsapp"></i> Order via WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                
                booksContainer.innerHTML += bookCard;
            });
        }).catch((error) => {
            console.error("Error fetching books: ", error);
            booksContainer.innerHTML = '<p class="text-center text-danger col-12">Error loading books. Please check your Firebase connection and refresh the page.</p>';
        });
    </script>
</body>
</html>
